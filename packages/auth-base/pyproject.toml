[project]
name = "llm-dev-auth-base"
version = "0.1.0"
description = "auth-base: acceso por clave de API con permisos exactos — el secreto se muestra una vez y el store solo guarda su huella (semana 25)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "llm-dev-web-api-base",
    "fastapi>=0.115",
    "starlette>=0.40",
]

[tool.uv.sources]
llm-dev-web-api-base = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth_base"]
