[project]
name = "llm-dev-agent-loop"
version = "0.1.0"
description = "agent-loop: loop con herramientas, confirmación explícita y presupuesto de pasos — el cerebro se inyecta (semana 21)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_loop"]
