[project]
name = "llm-dev-web-api-base"
version = "0.1.0"
description = "web-api-base: base FastAPI LLM-ready (ADR-0, semana 6)."
requires-python = ">=3.12"
dependencies = [
    "llm-dev-client",
    "llm-dev-schema-validate",
    "fastapi>=0.115",
    "starlette>=0.40",
]

[tool.uv.sources]
llm-dev-client = { workspace = true }
llm-dev-schema-validate = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_api_base"]