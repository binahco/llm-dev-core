[project]
name = "llm-dev-cache-ratelimit"
version = "0.1.0"
description = "cache-ratelimit: caché con TTL y límite de ritmo para la flota (§2.4; semana 8)."
requires-python = ">=3.12"
dependencies = [
    "llm-dev-client",
    "pydantic>=2.7",
]

[tool.uv.sources]
llm-dev-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cache_ratelimit"]