[project]
name = "llm-dev-vector-core"
version = "0.1.0"
description = "vector-core: embedder inyectable + búsqueda por coseno — léxico por defecto, semántico cuando exista un embedder real (semana 23)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vector_core"]
