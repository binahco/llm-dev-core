[project]
name = "llm-dev-secure-base"
version = "0.1.0"
description = "secure-base: secretos y datos sensibles nunca entran en prompts sin redacción (§3.1)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_base"]