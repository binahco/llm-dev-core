[project]
name = "llm-dev-parser-io"
version = "0.1.0"
description = "parser-io: capa de lectura de archivos — normaliza markdown/csv/json a ParsedDocument (semana 10)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parser_io"]