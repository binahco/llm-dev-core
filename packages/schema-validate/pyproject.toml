[project]
name = "llm-dev-schema-validate"
version = "0.1.0"
description = "schema-validate: la salida del LLM es input no confiable (D5)."
requires-python = ">=3.12"
dependencies = [
    "llm-dev-client",
    "pydantic>=2.7",
]

[tool.uv.sources]
llm-dev-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schema_validate"]