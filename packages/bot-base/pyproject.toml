[project]
name = "llm-dev-bot-base"
version = "0.1.0"
description = "bot-base: recurrencia programada determinista e idempotente (semana 9)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot_base"]