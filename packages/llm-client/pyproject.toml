[project]
name = "llm-dev-client"
version = "0.1.0"
description = "llm-client: toda llamada a un LLM pasa por aquí (retry, telemetría, costo, record/replay)."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_client"]