[project]
name = "llm-dev-test-kit"
version = "0.1.0"
description = "test-kit: en desarrollo LLM, los tests son datasets (D7, semana 5)."
requires-python = ">=3.12"
dependencies = [
    "llm-dev-client",
    "llm-dev-schema-validate",
    "pydantic>=2.7",
]

[tool.uv.sources]
llm-dev-client = { workspace = true }
llm-dev-schema-validate = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/test_kit"]