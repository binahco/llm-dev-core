[project]
name = "llm-dev-ci-pack"
version = "0.1.0"
description = "ci-pack: lints, jobs CI y página de evidencia para la flota (§2.1, §10.1; semana 7)."
requires-python = ">=3.12"
dependencies = [
    "llm-dev-client",
    "llm-dev-secure-base",
    "PyYAML>=6.0,<7",
    "pydantic>=2.7",
]

[tool.uv.sources]
llm-dev-client = { workspace = true }
llm-dev-secure-base = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_pack"]