[project]
name = "llm-dev-diff-engine"
version = "0.1.0"
description = "diff-engine: comparación estructural determinista — textos en hunks, registros campo a campo con volatiles declarados (semana 19)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diff_engine"]
