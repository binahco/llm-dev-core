[project]
name = "llm-dev-core"
version = "0.1.0"
description = "Núcleo versionado del que dependen 52 proyectos en 52 semanas: un solo sistema acumulativo."
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0,<7"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["packages"]