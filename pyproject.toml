[project]
name = "llm-dev-core"
version = "0.8.0"
description = "Núcleo versionado del que dependen 52 proyectos en 52 semanas: un solo sistema acumulativo."
authors = [{ name = "binahco", email = "binahco.sas@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0,<7",
    "httpx>=0.27",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "starlette>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/llm-client/src/llm_client",
    "packages/schema-validate/src/schema_validate",
    "packages/secure-base/src/secure_base",
    "packages/test-kit/src/test_kit",
    "packages/web-api-base/src/web_api_base",
    "packages/ci-pack/src/ci_pack",
    "packages/cache-ratelimit/src/cache_ratelimit",
]

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["packages"]